    function startReview(){session=due().map(w=>w.id);idx=0;stats={again:0,hard:0,good:0};showCard()}
    function showCard(){const w=data.words.find(x=>x.id===session[idx]);document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><section class="modal"><button class="close" id="closeModal">×</button><div class="progress"><span>${idx+1} / ${session.length}</span><i><b style="width:${(idx+1)/session.length*100}%"></b></i></div><div class="review-body"><span class="category">${esc(w.category)} · ${esc(w.group)}</span><div class="review-term"><h2>${esc(w.term)}</h2><button class="speak" id="reviewSpeak" aria-label="慢速朗读" aria-pressed="false">▶</button></div><span class="review-phonetic">${esc(w.phonetic||'')}</span><small class="voice-note">词刻内置自然发音 · 手机无需语音引擎</small><button class="reveal" id="reveal">显示释义</button><div class="answer hidden" id="answer"><span>中文释义</span><strong>${esc(w.meaning)}</strong><small>来源：${esc(w.source)}</small></div></div><div class="ratings hidden" id="ratings"><button class="again" data-rate="again"><span>不认识</span><small>明天再见</small></button><button class="hard" data-rate="hard"><span>有点模糊</span><small>缩短间隔</small></button><button class="good" data-rate="good"><span>认识</span><small>延长间隔</small></button></div></section></div>`;document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#reviewSpeak').onclick=e=>speak(w.term,e.currentTarget);document.querySelector('#reveal').onclick=e=>{e.target.classList.add('hidden');document.querySelector('#answer').classList.remove('hidden');document.querySelector('#ratings').classList.remove('hidden')};document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rate(w.id,b.dataset.rate))}
    function rate(id,r){stats[r]++;data.words=data.words.map(w=>{if(w.id!==id)return w;let stage=w.stage,interval=1;if(r==='good'){stage=Math.min(w.stage+1,INTERVALS.length-1);interval=INTERVALS[stage]}else if(r==='hard'){stage=Math.max(0,w.stage-1);interval=w.stage>=2?3:1}else stage=0;return{...w,stage,reviews:w.reviews+1,lastReviewed:today(),dueDate:addDays(today(),interval)}});if(!data.studyDates.includes(today()))data.studyDates.push(today());save();idx++;idx>=session.length?finish():showCard()}
    function finish(){document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><section class="modal"><div class="finish"><span class="finish-mark">✓</span><span class="eyebrow">SESSION COMPLETE</span><h2>本轮复习完成</h2><p>认识 ${stats.good} · 模糊 ${stats.hard} · 不认识 ${stats.again}</p><button class="primary" id="finishBtn">返回首页</button></div></section></div>`;document.querySelector('#finishBtn').onclick=closeModal}
    function closeModal(){stopSpeaking();document.querySelector('#modalRoot').innerHTML='';render()}
    const isInstalled=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
    function updateInstallButton(){const btn=document.querySelector('#installBtn');if(btn)btn.hidden=isInstalled()}
    function showInstallGuide(){
      const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),inApp=/micromessenger|weibo|qq\//i.test(navigator.userAgent);
      const steps=inApp?'请先点击右上角菜单，选择“在浏览器中打开”，再使用浏览器的“添加到主屏幕”。':ios?'请使用 Safari 打开本页，点击底部“分享”按钮，再选择“添加到主屏幕”。':'请打开浏览器菜单，选择“安装应用”或“添加到主屏幕”。';
      document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><section class="modal auth-form"><button type="button" class="close" id="closeModal">×</button><span class="eyebrow">INSTALL CIKE</span><h2>把词刻装到桌面</h2><div class="cloud-card"><span>安装方法</span><strong>${esc(steps)}</strong><small>安装后会以独立窗口启动；邮箱登录、云同步和复习记录保持不变。</small></div><p class="security-note">若浏览器暂未显示安装选项，请刷新页面后稍等几秒再试。</p></section></div>`;
      document.querySelector('#closeModal').onclick=closeModal;
    }
    async function installApp(){
      if(!installPrompt){showInstallGuide();return}
      installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;updateInstallButton();
    }
    function updateCloudButton(){
      const btn=document.querySelector('#cloudBtn'),label=document.querySelector('#cloudLabel');if(!btn||!label)return;
      btn.className='sync-btn';
      if(!navigator.onLine){btn.classList.add('error');label.textContent='离线使用';return}
      if(cloudState==='syncing'){btn.classList.add('syncing');label.textContent='同步中';return}
      if(cloudState==='online'&&cloudSession){btn.classList.add('online');label.textContent='已同步';return}
      if(cloudState==='error'){btn.classList.add('error');label.textContent='同步异常';return}
      label.textContent=cloudReady?'登录同步':'同步待连接';
    }
    function queueCloudSync(){
      if(!cloudReady||!cloudSession||!navigator.onLine||cloudSyncing)return;
      clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>syncNow(),1200);
    }
    function storeSession(session){
      cloudSession=session||null;
      if(cloudSession){if(!cloudSession.expires_at&&cloudSession.expires_in)cloudSession.expires_at=Math.floor(Date.now()/1000)+cloudSession.expires_in;localStorage.setItem(SESSION_KEY,JSON.stringify(cloudSession));cloudState='online'}
      else{localStorage.removeItem(SESSION_KEY);cloudState=cloudReady?'signedOut':'setup'}
      updateCloudButton();
    }
    async function rawCloud(path,options={}){
      const res=await fetch(`${CLOUD.url}${path}`,{...options,headers:{apikey:CLOUD.publishableKey,'Content-Type':'application/json',...(options.headers||{})}});
      if(!res.ok){let detail='';try{const body=await res.json();detail=body.msg||body.message||body.error_description||body.error||''}catch(e){}throw new Error(detail||`请求失败（${res.status}）`)}
      if(res.status===204)return null;const text=await res.text();return text?JSON.parse(text):null;
    }
    async function ensureSession(){
      if(!cloudSession?.refresh_token)throw new Error('登录状态已失效，请重新登录');
      if((cloudSession.expires_at||0)>Math.floor(Date.now()/1000)+90)return cloudSession;
      const freshSession=await rawCloud('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloudSession.refresh_token})});
      storeSession(freshSession);return cloudSession;
    }
    async function authedCloud(path,options={}){
      const session=await ensureSession();return rawCloud(path,{...options,headers:{Authorization:`Bearer ${session.access_token}`,...(options.headers||{})}});
    }
    function wordRank(w){return [Date.parse(w.lastReviewed||0)||0,Number(w.reviews)||0,Number(w.stage)||0]}
    function newerWord(a,b){const ar=wordRank(a),br=wordRank(b);for(let i=0;i<ar.length;i++){if(ar[i]!==br[i])return ar[i]>br[i]?a:b}return Date.parse(data.updatedAt||0)>=Date.parse(b.updatedAt||0)?a:b}
    function mergeCloudData(local,remote){
      if(!remote?.words?.length)return local;
      const merged=new Map();
      [...remote.words,...local.words].forEach(w=>{const key=normalizeTerm(w.term);if(!key)return;const old=merged.get(key);merged.set(key,old?{...old,...newerWord(w,old),phonetic:w.phonetic||old.phonetic}:{...w})});
      return{...remote,...local,words:[...merged.values()],studyDates:[...new Set([...(remote.studyDates||[]),...(local.studyDates||[])])].sort(),migrations:[...new Set([...(remote.migrations||[]),...(local.migrations||[])])],updatedAt:[remote.updatedAt,local.updatedAt].filter(Boolean).sort().pop()||isoNow()};
    }
    async function syncNow(){
      if(!cloudReady||!cloudSession||cloudSyncing||!navigator.onLine)return;
      cloudSyncing=true;cloudState='syncing';updateCloudButton();
      try{
        const userResponse=cloudSession.user||await authedCloud('/auth/v1/user'),user=userResponse.user||userResponse;if(!user?.id)throw new Error('无法确认登录账号');cloudSession.user=user;storeSession(cloudSession);
        const rows=await authedCloud(`/rest/v1/${CLOUD.table}?select=payload,updated_at&user_id=eq.${encodeURIComponent(user.id)}`);
        if(rows?.[0]?.payload)data=mergeCloudData(data,rows[0].payload);
        data.updatedAt=isoNow();
        await authedCloud(`/rest/v1/${CLOUD.table}?on_conflict=user_id`,{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:user.id,payload:data,updated_at:data.updatedAt})});
        localStorage.setItem(KEY,JSON.stringify(data));lastSyncedAt=isoNow();cloudState='online';render();
      }catch(err){cloudState='error';console.warn('词刻同步失败',err);updateCloudButton()}
      finally{cloudSyncing=false;updateCloudButton()}
    }
    async function authSubmit(mode,email,password){
      if(!cloudReady)throw new Error('云数据库尚未连接');
      if(mode==='register'){
        const result=await rawCloud('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password})});
        if(result.access_token){storeSession(result);await syncNow();return'注册并登录成功'}
        return'注册成功，请打开邮箱完成验证后再登录';
      }
      const result=await rawCloud('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});storeSession(result);await syncNow();return'登录并同步成功';
    }
    function showCloud(mode='login',message=''){
      if(!cloudReady){document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><section class="modal auth-form"><button type="button" class="close" id="closeModal">×</button><span class="eyebrow">CLOUD SYNC</span><h2>云同步界面已完成</h2><p class="auth-intro">邮箱登录、自动同步和离线保护已经设计完成。连接免费云数据库后即可启用。</p><div class="cloud-card"><span>当前状态</span><strong>等待连接数据库</strong><small>本地背词功能仍可正常使用，已有记录不会受影响。</small></div><p class="security-note">安全设计：每个账号只能读取和修改自己的词库；网页中只使用可公开的连接密钥，不会放入管理员密钥。</p></section></div>`;document.querySelector('#closeModal').onclick=closeModal;return}
      if(cloudSession){const email=cloudSession.user?.email||'已登录账号',time=lastSyncedAt?new Date(lastSyncedAt).toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}):'等待首次同步';document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><section class="modal auth-form"><button type="button" class="close" id="closeModal">×</button><span class="eyebrow">CLOUD ACCOUNT</span><h2>背诵记录同步</h2><div class="cloud-card"><span>当前账号</span><strong>${esc(email)}</strong><small>${navigator.onLine?`最近同步：${esc(time)}`:'当前离线，联网后自动同步'}</small></div><div class="cloud-actions"><button id="syncNowBtn">立即同步</button><button class="logout" id="logoutBtn">退出登录</button></div><p class="security-note">手机和电脑登录同一邮箱后，将共用单词、复习阶段、到期日期和学习记录。</p></section></div>`;document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#syncNowBtn').onclick=async()=>{await syncNow();showCloud()};document.querySelector('#logoutBtn').onclick=async()=>{try{await authedCloud('/auth/v1/logout',{method:'POST'})}catch(e){}storeSession(null);closeModal()};return}
      document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><form class="modal auth-form" id="authForm"><button type="button" class="close" id="closeModal">×</button><span class="eyebrow">CLOUD SYNC</span><h2>${mode==='register'?'创建词刻账号':'登录并同步'}</h2><p class="auth-intro">使用同一邮箱登录手机和电脑，背诵进度会自动合并。</p><div class="auth-tabs"><button type="button" data-auth="login" class="${mode==='login'?'active':''}">登录</button><button type="button" data-auth="register" class="${mode==='register'?'active':''}">注册</button></div><label>邮箱<input name="email" type="email" autocomplete="email" required placeholder="name@example.com"></label><label>密码<input name="password" type="password" minlength="6" autocomplete="${mode==='register'?'new-password':'current-password'}" required placeholder="至少 6 位"></label><button class="primary auth-submit" type="submit">${mode==='register'?'注册并开始同步':'登录并同步'}</button><div class="auth-message" id="authMessage">${esc(message)}</div><p class="security-note">首次登录会合并本机和云端记录，不会清空已有进度。</p></form></div>`;
      document.querySelector('#closeModal').onclick=closeModal;document.querySelectorAll('[data-auth]').forEach(b=>b.onclick=()=>showCloud(b.dataset.auth));document.querySelector('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),msg=document.querySelector('#authMessage'),submit=e.target.querySelector('[type="submit"]');submit.disabled=true;msg.textContent='正在连接…';try{const result=await authSubmit(mode,String(f.get('email')).trim(),String(f.get('password')));if(cloudSession){closeModal()}else showCloud('login',result)}catch(err){msg.textContent=err.message||'操作失败，请稍后重试';submit.disabled=false}};
    }
    async function bootstrapCloud(){
      updateCloudButton();if(!cloudReady||!cloudSession||!navigator.onLine)return;
      try{await ensureSession();await syncNow()}catch(err){storeSession(null);cloudState='error';updateCloudButton()}
    }
    function showAdd(){document.querySelector('#modalRoot').innerHTML=`<div class="backdrop"><form class="modal add-form" id="addForm"><button type="button" class="close" id="closeModal">×</button><span class="eyebrow">NEW ENTRY</span><h2>添加到词库</h2><label>单词或固定搭配<input name="term" required placeholder="例如 notwithstanding"></label><label>音标（选填）<input name="phonetic" placeholder="例如 /ˌnɑːtwɪθˈstændɪŋ/"></label><label>中文释义<textarea name="meaning" required></textarea></label><div class="form-row"><label>大类<select name="category"><option>个人生词</option><option>逻辑连接</option></select></label><label>细分类<input name="group" value="自定义"></label></div><button class="primary" type="submit">保存并加入今日复习</button></form></div>`;document.querySelector('#closeModal').onclick=closeModal;document.querySelector('#addForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),term=f.get('term').trim();if(data.words.some(w=>normalizeTerm(w.term)===normalizeTerm(term))){alert('这个词已经在词库中，不会重复添加。');return}data.words.unshift({id:'custom-'+Date.now(),term,phonetic:f.get('phonetic').trim(),meaning:f.get('meaning').trim(),category:f.get('category'),group:f.get('group').trim()||'自定义',source:'手动添加',addedAt:today(),dueDate:today(),stage:0,reviews:0});save();closeModal()}}
    document.querySelector('#addBtn').onclick=showAdd;document.querySelector('#cloudBtn').onclick=()=>showCloud();document.querySelector('#installBtn').onclick=installApp;document.querySelector('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=`词刻备份-${today()}.json`;a.click();URL.revokeObjectURL(a.href)};document.querySelector('#importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.words))throw 0;data=x;save();render()}catch(err){alert('导入失败，请选择词刻导出的备份文件。')}e.target.value=''};
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;updateInstallButton()});window.addEventListener('appinstalled',()=>{installPrompt=null;updateInstallButton()});window.matchMedia('(display-mode: standalone)').addEventListener?.('change',updateInstallButton);
    window.addEventListener('online',()=>{cloudState=cloudSession?'online':cloudReady?'signedOut':'setup';updateCloudButton();queueCloudSync()});window.addEventListener('offline',updateCloudButton);
    if('speechSynthesis'in window){refreshVoices();window.speechSynthesis.onvoiceschanged=refreshVoices;window.addEventListener('pagehide',stopSpeaking)}
    render();updateInstallButton();bootstrapCloud();
    if('serviceWorker'in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname))){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js',{scope:'/'}).then(reg=>reg.update()).catch(err=>console.warn('词刻离线功能初始化失败',err)))}
  })();
  </script>
</body>
